<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault Digital</title>
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    
    <header>
        
        <div class="navbar-principal">
            
            
            <div class="nav-logo">
                <img src="img/logoEmpresa.jpg" alt="Logo de GameVault Digital" width="300" height="150" style="mix-blend-mode: multiply;" >
                <span class="logo-texto">GameVault Digital</span>
            </div>
            
        
            <nav class="nav-enlaces">
                <a href="index.html">Home</a> <span class="separador">|</span>
                <a href="Productos.html">Productos</a> <span class="separador">|</span>
                <a href="Nosotros.html">Nosotros</a> <span class="separador">|</span>
                <a href="Blog.html">Blogs</a> <span class="separador">|</span>
                <a href="Contacto.html">Contacto</a>
            </nav>

            
            <div class="nav-carrito">
                <a href="carrito.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-cart-fill" viewBox="0 0 16 16">
                        <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
                    </svg>
                    Carrito (0)
                </a>
            </div>
        </div>

        
    </header>

    <main class="contacto-page">
    <div class="contacto-card">
        
        
        <div class="contacto-icon">
            <img src="img/icono_contacto.png" alt="Icono de mensaje">
        </div>

        
        <h2>¡Hablemos!</h2>
        <p class="contacto-subtitle">Envíanos tu mensaje y te responderemos lo antes posible.</p>

        
        <form action="#" method="POST" class="contacto-form-modern">
            <div class="form-group">
                <label for="nombre">Tu Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana García" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ana@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Tu Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>

            <div class="form-group-checkbox">
                <input type="checkbox" id="politica" required>
                <label for="politica">Acepto la política de privacidad.</label>
            </div>

            <button type="submit" class="btn-submit">Enviar mensaje</button>
        </form>
    </div>
</main>

</body>
</html>
